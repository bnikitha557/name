# RDS (us-east-2). Password: ../aws-db.properties (rds.password) or env RDS_PASSWORD
spring.config.import=optional:file:../aws-db.properties

spring.application.name=authservice
server.port=8081

spring.datasource.url=jdbc:mysql://database-1.cpqysuqqqw39.us-east-2.rds.amazonaws.com:3306/auth_service?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=${rds.password:${RDS_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Session JDBC not required for this demo API
spring.session.jdbc.initialize-schema=never

jwt.expiration=604800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
