# Maven tests for auth + order services.
# Required secrets: none
name: OMS CI

on:
  pull_request:
    paths:
      - "Niks_order_management_service/authservice/**"
      - "Niks_order_management_service/ordermanagementsystem/**"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "Niks_order_management_service/authservice/**"
      - "Niks_order_management_service/ordermanagementsystem/**"
      - ".github/workflows/**"

jobs:
  authservice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Niks_order_management_service/authservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: chmod +x mvnw && ./mvnw -B test

  order-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Niks_order_management_service/ordermanagementsystem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: chmod +x mvnw && ./mvnw -B test
